<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">5F6-A research model scope</title>
  <desc id="desc">Signal path from guitar input through three preamp tube stages, volume and bright network, tone stack, oversampling and output. Power amp, transformer, speaker cabinet and microphone are outside the current model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16191f"/>
      <stop offset="1" stop-color="#252a32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#e7b75b"/>
    </marker>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#f6f0e4}
      .subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#aeb6c2}
      .blockTitle{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .blockText{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#d5d9df}
      .tag{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.4px}
      .arrow{stroke:#e7b75b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="430" rx="24" fill="url(#bg)"/>
  <text x="48" y="55" class="title">What this plug-in models</text>
  <text x="48" y="82" class="subtitle">Circuit-derived 5F6-A preamp and tone-control research model — not a complete amplifier/cabinet capture</text>

  <g filter="url(#shadow)">
    <rect x="45" y="145" width="132" height="125" rx="15" fill="#303742" stroke="#576170"/>
    <rect x="205" y="125" width="170" height="165" rx="15" fill="#61482e" stroke="#e7b75b" stroke-width="2"/>
    <rect x="405" y="145" width="180" height="125" rx="15" fill="#33444a" stroke="#6fb5ba" stroke-width="2"/>
    <rect x="615" y="125" width="170" height="165" rx="15" fill="#61482e" stroke="#e7b75b" stroke-width="2"/>
    <rect x="815" y="125" width="170" height="165" rx="15" fill="#61482e" stroke="#e7b75b" stroke-width="2"/>
    <rect x="1015" y="145" width="175" height="125" rx="15" fill="#33444a" stroke="#6fb5ba" stroke-width="2"/>
    <rect x="1220" y="145" width="135" height="125" rx="15" fill="#303742" stroke="#576170"/>
  </g>

  <text x="111" y="193" text-anchor="middle" class="blockTitle">Guitar in</text>
  <text x="111" y="220" text-anchor="middle" class="blockText">Input gain</text>

  <text x="290" y="178" text-anchor="middle" class="blockTitle">V1 · 12AX7</text>
  <text x="290" y="208" text-anchor="middle" class="blockText">First gain stage</text>
  <text x="290" y="230" text-anchor="middle" class="blockText">local linear fit</text>
  <text x="290" y="255" text-anchor="middle" class="blockText">−59.6x + 168.5 V</text>

  <text x="495" y="193" text-anchor="middle" class="blockTitle">Volume / Bright</text>
  <text x="495" y="220" text-anchor="middle" class="blockText">20 nF coupling</text>
  <text x="495" y="242" text-anchor="middle" class="blockText">1 MΩ + 100 pF</text>

  <text x="700" y="178" text-anchor="middle" class="blockTitle">V2 · 12AX7</text>
  <text x="700" y="208" text-anchor="middle" class="blockText">Nonlinear gain stage</text>
  <text x="700" y="230" text-anchor="middle" class="blockText">Dempwolf–Zölzer</text>
  <text x="700" y="252" text-anchor="middle" class="blockText">Nodal DK + Newton</text>

  <text x="900" y="178" text-anchor="middle" class="blockTitle">V3 · 12AX7</text>
  <text x="900" y="208" text-anchor="middle" class="blockText">Cathode follower</text>
  <text x="900" y="230" text-anchor="middle" class="blockText">Dempwolf–Zölzer</text>
  <text x="900" y="252" text-anchor="middle" class="blockText">Nodal DK + Newton</text>

  <text x="1102" y="193" text-anchor="middle" class="blockTitle">Tone stack</text>
  <text x="1102" y="220" text-anchor="middle" class="blockText">Treble · Bass · Middle</text>
  <text x="1102" y="242" text-anchor="middle" class="blockText">inside DK network</text>

  <text x="1288" y="193" text-anchor="middle" class="blockTitle">Audio out</text>
  <text x="1288" y="220" text-anchor="middle" class="blockText">4× oversampling</text>
  <text x="1288" y="242" text-anchor="middle" class="blockText">Mix + output gain</text>

  <path class="arrow" d="M177 208H198"/><path class="arrow" d="M375 208H398"/>
  <path class="arrow" d="M585 208H608"/><path class="arrow" d="M785 208H808"/>
  <path class="arrow" d="M985 208H1008"/><path class="arrow" d="M1190 208H1213"/>

  <rect x="205" y="320" width="985" height="34" rx="17" fill="#213c38" stroke="#4fae97"/>
  <text x="697" y="342" text-anchor="middle" class="tag" fill="#83d8c2">IMPLEMENTED: PREAMP · VOLUME/BRIGHT · TONE STACK · NONLINEAR SOLVER · 4× OVERSAMPLING</text>
  <rect x="205" y="370" width="985" height="34" rx="17" fill="#3d2929" stroke="#a45f5f"/>
  <text x="697" y="392" text-anchor="middle" class="tag" fill="#e3a4a4">NOT INCLUDED: POWER AMP · OUTPUT TRANSFORMER · 4×10 CABINET · SPEAKER/MIC RESPONSE</text>
</svg>
